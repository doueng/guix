# Remote builder firewall (docs/remote-builder-plan.md).  The Hetzner Cloud
# Firewall admits only 41641/udp; this repeats it on the host and admits ssh
# and guix publish from the tailnet only.
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state { established, related } accept
    ct state invalid drop
    iif lo accept
    ip protocol icmp accept
    ip6 nexthdr ipv6-icmp accept
    udp dport 41641 accept
    iifname "tailscale0" tcp dport { 22, 8080 } accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
  chain output {
    type filter hook output priority 0; policy accept;
  }
}
