onboarding = false

[update]
version_check = false

[terminal]
default_shell = "fish"
new_cwd = "follow"
shell_mode = "auto"

[session]
resume_agents_on_restore = true

[ui.toast]
delivery = "system"

[keys]
prefix = "ctrl+b"
help = "prefix+?"
edit_scrollback = "prefix+shift+e"
new_tab = "prefix+c"
next_tab = "prefix+n"
switch_tab = ["prefix+1..9", "ctrl+1..9"]

workspace_picker = ["prefix+w", "prefix+e"]
navigate_workspace_up = "w"
navigate_workspace_down = "e"

focus_pane_left = []
focus_pane_down = []
focus_pane_up = []
focus_pane_right = []

[[keys.command]]
key = "prefix+space"
type = "popup"
command = "$HOME/.local/bin/keyleader herdr"
description = "leader menu"
width = "50%"
height = "45%"

[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "$HOME/.local/bin/keyleader term-nav left"
description = "focus left or pass to Vim and Emacs"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "$HOME/.local/bin/keyleader term-nav down"
description = "focus down or pass to Vim, Emacs, Pi and fzf"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "$HOME/.local/bin/keyleader term-nav up"
description = "focus up or pass to Vim, Emacs, Pi and fzf"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "$HOME/.local/bin/keyleader term-nav right"
description = "focus right or pass to Vim, Emacs, Pi and shells"

[[keys.command]]
key = "prefix+h"
type = "shell"
command = "$HOME/.local/bin/keyleader nav left 'Ctrl+b h'"
description = "focus left, then the desktop"

[[keys.command]]
key = "prefix+j"
type = "shell"
command = "$HOME/.local/bin/keyleader nav down 'Ctrl+b j'"
description = "focus down, then the desktop"

[[keys.command]]
key = "prefix+k"
type = "shell"
command = "$HOME/.local/bin/keyleader nav up 'Ctrl+b k'"
description = "focus up, then the desktop"

[[keys.command]]
key = "prefix+l"
type = "shell"
command = "$HOME/.local/bin/keyleader nav right 'Ctrl+b l'"
description = "focus right, then the desktop"

[[keys.command]]
key = "prefix+a"
type = "popup"
command = "$HOME/.local/bin/herdr-agent-pick"
description = "focus an agent"
width = "85%"
height = "80%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "$HOME/.local/bin/bbh inbox"
description = "bbh inbox: threads that need you"
width = "85%"
height = "80%"

[[keys.command]]
key = "prefix+b"
type = "popup"
command = "$HOME/.local/bin/herdr-workspace-pick"
description = "focus an open workspace"
width = "70%"
height = "50%"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "fullerzz.sesh.open-picker"
description = "choose a project workspace"

[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "fullerzz.sesh.last"
description = "switch to the previous workspace"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "hotchpotch.herdr-tiny-fingers.open"
description = "copy visible text by hint"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "annotate.capture"
description = "annotate selection"

[[keys.command]]
key = "prefix+shift+p"
type = "plugin_action"
command = "annotate.copy-context"
description = "paste annotations as context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[ui]
confirm_close = false
agent_panel_sort = "spaces"
pane_borders = "off"
show_agent_labels_on_pane_borders = false
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"

[ui.sound]
enabled = false
