# Local Babashka implementation of fullerzz.sesh: the picker lists open Herdr
# workspaces first, then zoxide directories. Newly created projects get these
# additional tabs; the initial workspace tab remains the shell.
[[window]]
name = "emacs"
startup_script = "emacs-project-start"

[[window]]
name = "bbh"
startup_script = "emacs-bbh"

[[window]]
name = "jjui"
startup_script = "jjui"

# Apply the project layout to every new directory from zoxide or a direct path.
[[wildcard]]
pattern = "/**"
windows = ["emacs", "bbh", "jjui"]
