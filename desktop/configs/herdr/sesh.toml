# Newly created projects get these additional tabs; the initial workspace tab
# remains the shell.
[[window]]
name = "emacs"
startup_script = "emacs-project-start"

[[window]]
name = "bbh"
startup_script = "emacs-bbh"

[[window]]
name = "jjui"
startup_script = "jjui"

[[wildcard]]
pattern = "/**"
windows = ["emacs", "bbh", "jjui"]
