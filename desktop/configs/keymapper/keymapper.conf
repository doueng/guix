# Keymapper configuration, shared across applications.
# Physical Cmd chords become abstract commands (copy, paste, save, ...). Each
# block maps those commands to the chord its application expects. The default
# block reproduces the chords keyd sends today, so apps without a block do not change.

@forward-modifiers Shift Control Alt Meta
@enforce-lowercase-commands

[default]

Meta{Shift{Z}} >> redo
Meta{Shift{T}} >> reopentab
Meta{C} >> copy
Meta{V} >> paste
Meta{X} >> cut
Meta{Z} >> undo
Meta{A} >> selectall
Meta{S} >> save
Meta{F} >> find
Meta{N} >> newwindow
Meta{T} >> newtab
Meta{W} >> closetab
Meta{Q} >> quit
Meta{R} >> reload
Meta{H} >> ArrowLeft
Meta{J} >> ArrowDown
Meta{K} >> ArrowUp
Meta{L} >> ArrowRight
Meta{1} >> Control{1}
Meta{2} >> Control{2}
Meta{3} >> Control{3}
Meta{4} >> Control{4}
Meta{5} >> Control{5}
Meta{6} >> Control{6}
Meta{7} >> Control{7}
Meta{8} >> Control{8}
Meta{9} >> Control{9}
Meta{0} >> Control{0}

copy >> Control{Insert}
paste >> Shift{Insert}
cut >> Shift{Delete}
undo >> Control{Z}
redo >> Control{Y}
selectall >> Control{A}
save >> Control{S}
find >> Control{F}
newwindow >> Control{N}
newtab >> Control{T}
reopentab >> Control{Shift{T}}
closetab >> Control{W}
quit >> Control{Q}
reload >> Control{R}

# This staged adapter is not active while keyd owns the keyboard grab.
# Emacs reads these Control chords as its own commands.
[class = "Emacs"]

cut >> Control{W}
paste >> Control{Y}
undo >> Control{Slash}
selectall >> Control{X} H
save >> Control{X} Control{S}
find >> Control{S}
newtab >> Control{X} Control{F}
closetab >> Control{X} K
quit >> Control{X} Control{C}
redo >>
reopentab >>
newwindow >>
reload >>
