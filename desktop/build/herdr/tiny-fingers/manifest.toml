id = "hotchpotch.herdr-tiny-fingers"
name = "herdr-tiny-fingers"
version = "0.3.0"
min_herdr_version = "0.7.0"
description = "Frame-free visible-screen copy hints for Herdr"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open fingers mode"
description = "Open tmux-fingers style copy hints for the focused pane"
command = ["./bin/herdr-tiny-fingers", "open"]

[[panes]]
id = "finger"
title = "herdr-tiny-fingers"
placement = "overlay"
command = ["./bin/herdr-tiny-fingers"]
