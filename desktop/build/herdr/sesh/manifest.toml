id = "fullerzz.sesh"
name = "Sesh for Herdr"
version = "0.8.0"
min_herdr_version = "0.8.0"
description = "Local Babashka workspace picker with zoxide and project tabs"
platforms = ["linux"]

[[actions]]
id = "open-picker"
title = "Open Sesh Picker"
contexts = ["workspace", "pane"]
command = ["./bin/herdr-sesh", "plugin", "open-picker"]

[[actions]]
id = "last"
title = "Switch to Previous Workspace"
contexts = ["workspace", "pane"]
command = ["./bin/herdr-sesh", "last"]

[[panes]]
id = "picker"
title = "Sesh Picker"
placement = "overlay"
command = ["./bin/herdr-sesh", "picker"]
