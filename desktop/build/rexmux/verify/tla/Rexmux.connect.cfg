\* The control connection alone: the server stops and the connection drops
\* three times, for a local server the client may start and for one it may
\* not. No requests, panes streams or agents.
SPECIFICATION Spec
CONSTANTS
  Panes = {"p1"}
  Streams = {}
  MaxReq = 0
  MaxRestarts = 0
  MaxReports = 0
  MaxDrops = 0
  Control = TRUE
  MaxLosses = 3
INVARIANTS
  TypeOK
  NeverStranded
PROPERTIES
  ServerUpAttaches
  LocalAttaches
