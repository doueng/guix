<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cookie autoaccept</title>
<style>
  body { font: 13px system-ui, sans-serif; width: 260px; margin: 0; padding: 12px; color: #222; }
  h1 { font-size: 14px; margin: 0 0 6px; }
  #site { color: #666; word-break: break-all; }
  #status { margin: 10px 0; padding: 8px; background: #f3f3f3; border-radius: 6px; }
  label { display: block; margin: 6px 0; }
  fieldset { border: 1px solid #ddd; border-radius: 6px; margin: 10px 0 0; }
  .hint { color: #777; font-size: 11px; }
  .warn { color: #8a4b00; margin: 0 0 6px 22px; }
</style>
</head>
<body>
<h1>Cookie autoaccept</h1>
<div id="site"></div>
<div id="status">...</div>
<label><input type="checkbox" id="enabled"> On for this site</label>
<label><input type="checkbox" id="blocking"> Block consent scripts on this site</label>
<p class="hint warn" id="blocking-warning">Blocking stops the consent manager from loading at all. Embedded videos, maps, comments or checkout can break, because sites often wait for consent before they load them. Turn it off again if something is missing.</p>
<fieldset>
  <legend>On every site</legend>
  <label><input type="radio" name="mode" value="accept"> Accept cookies</label>
  <label><input type="radio" name="mode" value="reject"> Reject cookies</label>
</fieldset>
<p class="hint">Changes reload the tab.</p>
<script type="module" src="js/popup.js"></script>
</body>
</html>
