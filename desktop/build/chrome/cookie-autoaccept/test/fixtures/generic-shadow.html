<!doctype html>
<html><head><meta charset="utf-8"><title>pending</title>
<!-- Home-made banner inside an open shadow root, added late -->
<script>
  // Records which button the extension pressed, for the e2e test to read.
  window.mark = (what) => { document.title = what; };
  window.addEventListener('message', (e) => { if (e.data && e.data.consent) window.mark(e.data.consent); });
</script>
<style>.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #999;padding:16px;z-index:9999}</style>
</head>
<body>
<h1>Home-made banner inside an open shadow root, added late</h1>
<p>Article text.</p>
<script>
  setTimeout(() => {
    const host = document.createElement('cookie-note');
    host.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#fff;z-index:9';
    host.setAttribute('data-consent-ui', '');
    document.body.append(host);
    const root = host.attachShadow({ mode: 'open' });
    root.innerHTML = '<p>We use cookies for analytics and need your consent.</p><button>Reject</button><button>Accept all</button>';
    root.querySelectorAll('button')[0].onclick = () => { mark('rejected'); host.remove(); };
    root.querySelectorAll('button')[1].onclick = () => { mark('accepted'); host.remove(); };
  }, 4000);
</script>
</body></html>
