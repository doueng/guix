<!doctype html>
<html><head><meta charset="utf-8"><title>pending</title>
<!-- Cookiebot dialog (structure of consent.cookiebot.com uc.js); detection runs main-world eval snippets -->
<script>
  // Records which button the extension pressed, for the e2e test to read.
  window.mark = (what) => { document.title = what; };
  window.addEventListener('message', (e) => { if (e.data && e.data.consent) window.mark(e.data.consent); });
</script>
<style>.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #999;padding:16px;z-index:9999}</style>
</head>
<body>
<h1>Cookiebot dialog (structure of consent.cookiebot.com uc.js); detection runs main-world eval snippets</h1>
<p>Article text.</p>
<script>window.Cookiebot = { hasResponse: false, dialog: { visible: true }, withdraw() {}, hide() {} };</script>
<div id="CybotCookiebotDialog" data-consent-ui="cmp" class="bar">
  <p>This website uses cookies.</p>
  <button id="CybotCookiebotDialogBodyLevelButtonLevelOptinDeclineAll" onclick="mark('rejected');Cookiebot.hasResponse=true;Cookiebot.dialog.visible=false;this.parentNode.style.display='none'">Deny</button>
  <button id="CybotCookiebotDialogBodyButtonAccept" onclick="mark('accepted');Cookiebot.hasResponse=true;Cookiebot.dialog.visible=false;this.parentNode.style.display='none'">Allow all</button>
</div>
</body></html>
