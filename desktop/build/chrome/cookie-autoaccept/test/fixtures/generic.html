<!doctype html>
<html><head><meta charset="utf-8"><title>pending</title>
<!-- Home-made banner with no known CMP: accept mode clicks OK, reject mode hides it -->
<script>
  // Records which button the extension pressed, for the e2e test to read.
  window.mark = (what) => { document.title = what; };
  window.addEventListener('message', (e) => { if (e.data && e.data.consent) window.mark(e.data.consent); });
</script>
<style>.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #999;padding:16px;z-index:9999}</style>
</head>
<body>
<h1>Home-made banner with no known CMP: accept mode clicks OK, reject mode hides it</h1>
<p>Article text.</p>
<div id="notice" style="position:fixed;bottom:0;left:0;right:0;background:#fff;padding:16px;z-index:9">
  <p>This site uses cookies to improve your experience and analyse traffic.</p>
  <button>Settings</button>
  <button onclick="mark('accepted');document.getElementById('notice').remove()">OK</button>
</div>
</body></html>
