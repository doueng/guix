<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vimium (cljs)</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div id="vomnibar" hidden>
  <div id="bar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="query" autocomplete="off" spellcheck="false" aria-label="Search">
    <span id="chip"></span>
  </div>
  <ul id="list" role="listbox"></ul>
  <div id="keys"><span><kbd>↵</kbd>open</span><span><kbd>⇧↵</kbd>new tab</span><span><kbd>Tab</kbd>or <kbd>^n</kbd>next</span><span><kbd>^↵</kbd>search as typed</span><span><kbd>Esc</kbd>close</span></div>
</div>
<div id="help" hidden>
  <header>
    <h1>Vimium (cljs)</h1>
    <button id="close" aria-label="Close">×</button>
  </header>
  <div id="commands"></div>
  <p class="note">Ctrl+L opens the Vomnibar anywhere in Chrome, once it is set at chrome://extensions/shortcuts. To change keys, edit src/vimium_cljs/config.cljs and run ext-reload vimium-cljs.</p>
  <footer>Based on <a href="https://github.com/philc/vimium" target="_blank">Vimium</a> (MIT). Esc or ? closes.</footer>
</div>
<script src="js/ui.js"></script>
</body>
</html>
