# Guix Hyprland configuration. Hyprland 0.55 uses the native config syntax.
monitor = eDP-1, 2560x1600, auto, 1

general {
    gaps_in = 8
    gaps_out = 14
    border_size = 0
    layout = dwindle
}

decoration {
    rounding = 18
    shadow {
        enabled = true
        range = 18
    }
    blur {
        enabled = true
        size = 4
        passes = 2
    }
}

animations {
    enabled = false
}

dwindle {
    force_split = 2
    preserve_split = true
}

cursor {
    inactive_timeout = 2
    enable_hyprcursor = false
}

env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,20

input {
    repeat_delay = 250
    repeat_rate = 30
    sensitivity = 0.3
    accel_profile = adaptive
    scroll_method = 2fg
    touchpad {
        tap-to-click = false
        natural_scroll = true
        middle_button_emulation = false
        scroll_factor = 0.5
        clickfinger_behavior = true
        disable_while_typing = true
    }
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

exec-once = dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = /run/current-system/profile/libexec/polkit-gnome-authentication-agent-1
exec-once = ghostty

# Keyd's Command layer emits the Alt variants; keep both forms for
# troubleshooting with keyd stopped. Terminal bindings focus the existing
# Ghostty window, then select its Herdr tab when it is already focused.
bind = SUPER, RETURN, exec, ~/.local/bin/workspace-or-herdr-tab 1
bind = SUPER, SPACE, exec, ~/.local/bin/custom-launcher
bind = SUPER, U, workspace, 2
bind = SUPER SHIFT, U, workspace, 3
bind = SUPER, E, exec, ~/.local/bin/workspace-or-herdr-tab 2
bind = SUPER, D, exec, ~/.local/bin/workspace-or-herdr-tab 3
bind = SUPER, G, exec, ~/.local/bin/workspace-or-herdr-tab 4
bind = SUPER, S, exec, herdr
bind = SUPER, COMMA, exec, ghostty nvim ~/.config/hypr/hyprland.conf
bind = SUPER SHIFT, L, exec, /run/privileged/bin/hyprlock
bind = CTRL ALT, L, exec, /run/privileged/bin/hyprlock

bind = ALT, RETURN, exec, ~/.local/bin/workspace-or-herdr-tab 1
bind = ALT, SPACE, exec, ~/.local/bin/custom-launcher
bind = ALT, U, workspace, 2
bind = ALT SHIFT, U, workspace, 3
bind = ALT, E, exec, ~/.local/bin/workspace-or-herdr-tab 2
bind = ALT, D, exec, ~/.local/bin/workspace-or-herdr-tab 3
bind = ALT, G, exec, ~/.local/bin/workspace-or-herdr-tab 4
bind = ALT, W, killactive,
bind = ALT, F, fullscreen,

bind = ALT, left, movefocus, l
bind = ALT, down, movefocus, d
bind = ALT, up, movefocus, u
bind = ALT, right, movefocus, r
bind = ALT SHIFT, left, movewindow, l
bind = ALT SHIFT, down, movewindow, d
bind = ALT SHIFT, up, movewindow, u
bind = ALT SHIFT, right, movewindow, r

bind = ALT, 1, workspace, 1
bind = ALT, 2, workspace, 2
bind = ALT, 3, workspace, 3
bind = ALT, 4, workspace, 4
bind = ALT, 5, workspace, 5
bind = ALT, 6, workspace, 6
bind = ALT, 7, workspace, 7
bind = ALT, 8, workspace, 8
bind = ALT, 9, workspace, 9
bind = ALT, 0, workspace, 10
bind = ALT SHIFT, 1, movetoworkspace, 1
bind = ALT SHIFT, 2, movetoworkspace, 2
bind = ALT SHIFT, 3, movetoworkspace, 3
bind = ALT SHIFT, 4, movetoworkspace, 4
bind = ALT SHIFT, 5, movetoworkspace, 5
bind = ALT SHIFT, 6, movetoworkspace, 6
bind = ALT SHIFT, 7, movetoworkspace, 7
bind = ALT SHIFT, 8, movetoworkspace, 8
bind = ALT SHIFT, 9, movetoworkspace, 9
bind = ALT SHIFT, 0, movetoworkspace, 10

bind = , PRINT, exec, sh -c 'mkdir -p ~/Pictures; grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png'
bind = CTRL SHIFT, 4, exec, sh -c 'region=$(slurp) && grim -g "$region" - | wl-copy --type image/png'
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, /home/engstrand/guix/desktop/bin/system-info
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
